# comparison_config.yaml
# Run with:
#   python3 ./ResultsComparison/compare_bar_graphs.py --config ./ResultsComparison/comparison_config.yaml

output_dir: comparison_plots_phase2

# Optional:
# metrics:
#   - PDR
#   - Avg Delay
#   - "#Retransmissions"

include_run_no: false
show: false
skip_bar_plots: false

# Choose which graph workflows to run.
# Options: bar_plots, delay_overlay, energy_consumption
graphs:
  - bar_plots
  - delay_overlay
  - energy_consumption

# Split every graph workflow into multiple PNGs with this many experiments each.
# Example: 27 experiments become *_part_01.png, *_part_02.png, *_part_03.png.
# Applies to bar_plots, delay_overlay, and energy_consumption.
graph_group_size: 9

# Optional: exact metric column names to use for the energy-consumption graph.
# Leave blank to auto-detect columns containing energy, consumption, joule, or power.
# energy_metrics:
#   - Energy Consumption

delay_window: 100
delay_nth: 5
delay_scatter_alpha: 0.2
delay_recursive: false

